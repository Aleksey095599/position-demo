  <dialog class="market-bootstrap-dialog one-batch-tenor-dialog" id="oneBatchTenorDialog" aria-labelledby="oneBatchTenorDialogTitle">

      <header class="modal-header">
        <h2 class="modal-title" id="oneBatchTenorDialogTitle">Incompatible Batching Keys Selected</h2>
