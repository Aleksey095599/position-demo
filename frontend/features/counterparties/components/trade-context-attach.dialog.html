  <dialog class="deal-dialog pricing-rule-bootstrap-dialog client-context-attach-dialog" id="clientTradeContextAttachDialog" aria-labelledby="clientTradeContextAttachDialogTitle">
    <form class="deal-form modal-content" id="clientTradeContextAttachForm" autocomplete="off">
      <div class="dialog-head modal-header">
        <div>
          <h2 class="dialog-title modal-title" id="clientTradeContextAttachDialogTitle">Attach Trade Contexts</h2>
          <p class="client-context-attach-subtitle" id="clientTradeContextAttachDialogSubtitle"></p>
        </div>
        <div class="client-context-attach-header-actions">
          <button type="button" class="dialog-close btn-close" id="clientTradeContextAttachDialogClose" aria-label="Close"></button>
        </div>
      </div>
      <div class="deal-form-body modal-body">
        <section class="table-panel table-panel--standalone table-panel--compact" aria-labelledby="clientTradeContextAttachTableTitle">
          <div class="table-panel__head">
            <h3 class="table-panel__title" id="clientTradeContextAttachTableTitle">Available Trade Contexts</h3>
            <div class="table-panel__tools">
              <button
                type="button"
                class="btn btn-sm btn-outline-secondary ui-table-layout-button"
                data-ui-table-layout="trade_contexts_grid"
                data-ui-table-layout-columns="id servicing_location accounting_system originating_system"
                data-ui-table-layout-title="Attach Trade Contexts Table Layout"
                aria-label="Attach Trade Contexts table layout"
                data-tooltip="Column widths"
              >
                <span class="button-icon" aria-hidden="true">view_column</span>
              </button>
            </div>
          </div>
          <div class="client-context-attach-table-wrap table-panel__body table-panel__viewport">
          <table class="profile-table unified-data-table client-context-attach-table" data-column-sizing="managed">
            <colgroup>
              <col class="client-context-attach-select-col" data-client-context-attach-fixed-width="46">
              <col class="client-context-attach-id-col" data-client-context-attach-layout-column="id">
              <col class="client-context-attach-location-col" data-client-context-attach-layout-column="servicing_location">
              <col class="client-context-attach-accounting-col" data-client-context-attach-layout-column="accounting_system">
              <col class="client-context-attach-originating-col" data-client-context-attach-layout-column="originating_system">
              <col class="client-context-attach-mode-col" data-client-context-attach-fixed-width="184">
            </colgroup>
            <thead>
              <tr>
                <th class="client-context-attach-select-cell">
                  <div class="reference-column-head reference-column-head-static reference-column-head-centered">
                    <input type="checkbox" class="form-check-input" id="clientTradeContextAttachSelectAll" aria-label="Select all visible Trade Contexts">
                  </div>
                </th>
                <th>
                  <div class="reference-column-head">
                    <button type="button" class="reference-column-title reference-sort-control" id="clientTradeContextAttachIdSort" aria-label="Sort available trade contexts by ID ascending" aria-pressed="true">
                      <span>ID</span>
                      <span class="reference-sort-indicator" aria-hidden="true"></span>
                    </button>
                    <input class="reference-header-filter" type="text" id="clientTradeContextAttachIdFilter" autocomplete="off" data-client-context-attach-filter="pricingContextId" aria-label="Filter available trade contexts by ID">
                  </div>
                </th>
                <th>
                  <div class="reference-column-head">
                    <span class="reference-column-title">
                      <span class="button-icon" aria-hidden="true">location_on</span>
                      <span>Servicing Location</span>
                    </span>
                    <input class="reference-header-filter" type="text" autocomplete="off" data-client-context-attach-filter="servicingBranchCode" aria-label="Filter available trade contexts by servicing location">
                  </div>
                </th>
                <th>
                  <div class="reference-column-head">
                    <span class="reference-column-title">
                      <span class="button-icon" aria-hidden="true">account_balance</span>
                      <span>Accounting System</span>
                    </span>
                    <input class="reference-header-filter" type="text" autocomplete="off" data-client-context-attach-filter="settlementSystemId" aria-label="Filter available trade contexts by accounting system">
                  </div>
                </th>
                <th>
                  <div class="reference-column-head">
                    <span class="reference-column-title">
                      <span class="button-icon" aria-hidden="true">web_asset</span>
                      <span>Originating System</span>
                    </span>
                    <input class="reference-header-filter" type="text" autocomplete="off" data-client-context-attach-filter="tradeCaptureChannelId" aria-label="Filter available trade contexts by originating system">
                  </div>
                </th>
                <th>
                  <div class="reference-column-head">
                    <span class="reference-column-title">
                      <span class="button-icon" aria-hidden="true">price_change</span>
                      <span>Pricing Mode</span>
                    </span>
                    <select class="reference-header-filter form-select" data-client-context-attach-filter="pricingMode" aria-label="Filter available trade contexts by pricing mode">
                      <option value="">All</option>
                      <option value="AUTO_PRICED">Auto Priced</option>
                      <option value="DEALER_PRICED">Dealer Priced</option>
                      <option value="DEALER_APPROVED">Dealer Approved</option>
                    </select>
                  </div>
                </th>
              </tr>
            </thead>
            <tbody id="clientTradeContextAttachRows"></tbody>
          </table>
          </div>
        </section>
        <div class="profile-status client-context-attach-status" id="clientTradeContextAttachStatus" role="status" aria-live="polite"></div>
      </div>
      <div class="dialog-actions modal-footer">
        <span class="client-context-attach-selection" id="clientTradeContextAttachSelection">0 selected</span>
        <button type="button" class="btn btn-sm btn-outline-secondary with-icon" id="clientTradeContextAttachCancelButton">
          <span class="button-icon" aria-hidden="true">close</span>
          <span>Cancel</span>
        </button>
        <button type="submit" class="btn btn-sm btn-primary with-icon" id="clientTradeContextAttachSubmitButton" disabled>
          <span class="button-icon" aria-hidden="true">add_link</span>
          <span id="clientTradeContextAttachSubmitLabel">Attach</span>
        </button>
      </div>
    </form>
  </dialog>
