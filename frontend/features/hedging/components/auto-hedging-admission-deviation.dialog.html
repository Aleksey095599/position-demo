  <dialog class="market-bootstrap-dialog auto-hedging-admission-deviation-dialog" id="autoHedgingAdmissionDeviationDialog" aria-labelledby="autoHedgingAdmissionDeviationDialogTitle">
    <form class="modal-content" id="autoHedgingAdmissionDeviationDialogForm" autocomplete="off">
      <header class="modal-header">
        <div>
          <h2 class="modal-title" id="autoHedgingAdmissionDeviationDialogTitle">Transfer Rate Deviation</h2>
          <p>Set the maximum permitted percentage difference between Transfer Rate and the applicable Market Pulse rate for each Ccy Pair.</p>
        </div>
        <button type="button" class="btn-close" id="autoHedgingAdmissionDeviationDialogClose" aria-label="Close"></button>
      </header>
      <div class="modal-body">
        <div class="auto-hedging-admission-deviation-table-viewport">
          <table class="table table-sm table-hover align-middle unified-data-table auto-hedging-admission-deviation-table" data-column-sizing="managed">
            <colgroup>
              <col class="auto-hedging-admission-deviation-pair-col">
              <col class="auto-hedging-admission-deviation-value-col">
            </colgroup>
            <thead>
              <tr>
                <th scope="col">
                  <div class="reference-column-head">
                    <span class="reference-column-title">Ccy Pair</span>
                    <input class="reference-header-filter" type="search" id="autoHedgingAdmissionDeviationSearch" autocomplete="off" aria-label="Filter deviations by Ccy Pair">
                  </div>
                </th>
                <th scope="col">
                  <div class="reference-column-head reference-column-head-static">
                    <span class="reference-column-title">Maximum Transfer Rate Deviation (%)</span>
                  </div>
                </th>
              </tr>
            </thead>
            <tbody id="autoHedgingAdmissionDeviationRows"></tbody>
          </table>
          <div class="auto-hedging-admission-deviation-empty" id="autoHedgingAdmissionDeviationEmpty" role="status" hidden>No Currency Pairs match the current search.</div>
        </div>
      </div>
      <footer class="modal-footer">
        <span class="auto-hedging-admission-dialog-status" id="autoHedgingAdmissionDeviationDialogStatus" role="status" aria-live="polite"></span>
        <button type="button" class="btn btn-outline-secondary" id="autoHedgingAdmissionDeviationDialogCancel">Cancel</button>
        <button type="submit" class="btn btn-primary with-icon" id="autoHedgingAdmissionDeviationDialogSave" disabled>
          <span class="button-icon" aria-hidden="true">save</span>
          <span>Save Changes</span>
        </button>
      </footer>
    </form>
  </dialog>
