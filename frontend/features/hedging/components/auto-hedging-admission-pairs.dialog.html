  <dialog class="market-bootstrap-dialog auto-hedging-admission-pair-dialog" id="autoHedgingAdmissionPairDialog" aria-labelledby="autoHedgingAdmissionPairDialogTitle">
    <form class="modal-content" id="autoHedgingAdmissionPairDialogForm" autocomplete="off">
      <header class="modal-header">
        <div>
          <h2 class="modal-title" id="autoHedgingAdmissionPairDialogTitle">Ccy Pair Eligibility and Trade Amount Limits</h2>
          <p>New or unlisted Currency Pairs remain disabled until they are explicitly enabled and assigned a limit.</p>
        </div>
        <button type="button" class="btn-close" id="autoHedgingAdmissionPairDialogClose" aria-label="Close"></button>
      </header>
      <div class="modal-body">
        <div class="auto-hedging-admission-pair-table-viewport">
          <table class="table table-sm table-hover align-middle unified-data-table auto-hedging-admission-pair-table" data-column-sizing="managed">
            <colgroup>
              <col class="auto-hedging-admission-pair-code-col">
              <col class="auto-hedging-admission-pair-enabled-col">
              <col class="auto-hedging-admission-pair-limit-col">
            </colgroup>
            <thead>
              <tr>
                <th scope="col">
                  <div class="reference-column-head">
                    <span class="reference-column-title">Ccy Pair</span>
                    <input class="reference-header-filter" type="search" id="autoHedgingAdmissionPairSearch" autocomplete="off" aria-label="Filter admission settings by Ccy Pair">
                  </div>
                </th>
                <th scope="col" class="text-center">
                  <div class="reference-column-head">
                    <span class="reference-column-title">Automatic Admission Enabled</span>
                    <select class="reference-header-filter form-select" id="autoHedgingAdmissionPairFilter" aria-label="Filter Currency Pairs by automatic admission status">
                      <option value="ALL">All</option>
                      <option value="ENABLED">Enabled</option>
                      <option value="DISABLED">Disabled</option>
                    </select>
                  </div>
                </th>
                <th scope="col">
                  <div class="reference-column-head reference-column-head-static">
                    <span class="reference-column-title">Maximum Trade Amount (Base Ccy)</span>
                  </div>
                </th>
              </tr>
            </thead>
            <tbody id="autoHedgingAdmissionPairRows"></tbody>
          </table>
          <div class="auto-hedging-admission-pair-empty" id="autoHedgingAdmissionPairEmpty" role="status" hidden>No Currency Pairs match the current filters.</div>
        </div>
      </div>
      <footer class="modal-footer">
        <span class="auto-hedging-admission-dialog-status" id="autoHedgingAdmissionPairDialogStatus" role="status" aria-live="polite"></span>
        <button type="button" class="btn btn-outline-secondary" id="autoHedgingAdmissionPairDialogCancel">Cancel</button>
        <button type="submit" class="btn btn-primary with-icon" id="autoHedgingAdmissionPairDialogSave" disabled>
          <span class="button-icon" aria-hidden="true">save</span>
          <span>Save Changes</span>
        </button>
      </footer>
    </form>
  </dialog>
