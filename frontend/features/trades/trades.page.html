  <main class="shell blotter-shell client-deals-bootstrap unified-bootstrap-workspace workbench-page" id="dealsPage" hidden>
    <section class="action-bar workbench-page-header" aria-label="Trades header">
      <h1 class="page-title">Trades</h1>
    </section>

    <nav class="nav nav-tabs workbench-section-tabs trades-scope-tabs" aria-label="Trade types" role="tablist">
      <a class="nav-link" id="clientDealsTab" href="#client-deals" data-deals-route="client-deals" role="tab" aria-controls="clientDealsPage" aria-selected="false">
        <span class="button-icon" aria-hidden="true">handshake</span>
        <span>Client Deals</span>
      </a>
      <a class="nav-link" id="hedgeDealsTab" href="#hedge-deals" data-deals-route="hedge-deals" role="tab" aria-controls="hedgeDealsPage" aria-selected="false">
        <span class="button-icon" aria-hidden="true">shield</span>
        <span>Hedge Deals</span>
      </a>
    </nav>

    <section class="trades-tab-panel table-panel table-panel--standalone" id="clientDealsPage" role="tabpanel" aria-labelledby="clientDealsTab" hidden>
      <section class="client-deals-toolbar table-panel__head" data-ui-table-layout-host="client_deals_grid" aria-label="Client Deals table layout">
        <h2 class="table-panel__title">Client Deals</h2>
        <div class="form-check form-switch deals-view-switch">
          <input class="form-check-input" type="checkbox" role="switch" id="clientDealsAuditView" data-deals-audit-toggle data-deals-view-scope="client">
          <label class="form-check-label" for="clientDealsAuditView">Advanced View</label>
        </div>
        <span class="client-deals-count" id="clientDealsCount">0 deals</span>
      </section>
      <section class="client-deals-grid-shell trades-table-viewport table-panel__body table-panel__viewport" aria-label="client_deals">
        <div class="deals-grid" id="clientDealsGrid" aria-label="Client Deals table"></div>
      </section>
    </section>

    <section class="trades-tab-panel table-panel table-panel--standalone" id="hedgeDealsPage" role="tabpanel" aria-labelledby="hedgeDealsTab" hidden>
      <section class="client-deals-toolbar table-panel__head" data-ui-table-layout-host="hedge_deals_grid" aria-label="Hedge Deals table layout">
        <h2 class="table-panel__title">Hedge Deals</h2>
        <div class="form-check form-switch deals-view-switch">
          <input class="form-check-input" type="checkbox" role="switch" id="hedgeDealsAuditView" data-deals-audit-toggle data-deals-view-scope="hedge">
          <label class="form-check-label" for="hedgeDealsAuditView">Advanced View</label>
        </div>
        <span class="client-deals-count" id="hedgeDealsCount">0 deals</span>
      </section>
      <section class="client-deals-grid-shell trades-table-viewport table-panel__body table-panel__viewport" aria-label="hedge_deals">
        <div class="deals-grid" id="hedgeDealsGrid" aria-label="Hedge Deals table"></div>
      </section>
    </section>
  </main>
